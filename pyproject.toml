[project]
name = "unifi-cartographer"
version = "0.1.0.dev0"
description = "Read-only UniFi Network inventory and topology collector with draw.io rendering"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "William Porter", email = "liam@wporter.org" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Environment :: Console",
]

[project.urls]
Repository = "https://github.com/hpst3r/unifi-cartographer"

[project.scripts]
unifi-carto = "unifi_carto.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "trustme>=1.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unifi_carto"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "A", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits a real console (opt-in, UNIFI_CARTO_LIVE=1)"]
